[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crh-ai"
version = "0.1.0"
description = "CRH Geometric Coherence Base: Next-generation AI Architecture Core"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "transformers>=4.35",
    "pillow>=10.0",
]

[project.scripts]
crh-ai = "crh_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
